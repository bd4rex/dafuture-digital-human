<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#071b2a">
    <title>大未来 · 数字人问答</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2351dbc7'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34' font-weight='700' fill='%23071928'%3E未%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/avatar.css">
  </head>
  <body>
    <div class="page-glow page-glow-left" aria-hidden="true"></div>
    <div class="page-glow page-glow-right" aria-hidden="true"></div>

    <header class="topbar">
      <a class="stage-brand" href="/avatar" aria-label="大未来数字人首页">
        <span class="brand-symbol" aria-hidden="true">未</span>
        <span class="brand-copy">
          <strong>大未来</strong>
          <small>DIGITAL HUMAN</small>
        </span>
      </a>

      <div class="topbar-actions">
        <span class="mode-pill" id="live-mode-pill" data-mode="dialogue">
          <span class="mode-dot" aria-hidden="true"></span>
          <span id="live-mode-label">对话模式</span>
        </span>
        <span class="service-pill" id="service-pill">
          <span class="service-dot" aria-hidden="true"></span>
          <span id="service-label">正在连接内容服务</span>
        </span>
        <button class="quiet-action" id="sound-toggle" type="button" aria-pressed="true" aria-label="关闭语音播报">
          <span class="sound-icon" aria-hidden="true">♫</span>
          <span id="sound-label">语音已开启</span>
        </button>
        <a class="quiet-action admin-link" href="/">内容工作台</a>
      </div>
    </header>

    <main class="experience-shell">
      <section class="avatar-zone" aria-labelledby="avatar-name">
        <div class="state-readout" aria-live="polite">
          <span class="state-indicator" aria-hidden="true">
            <i></i><i></i><i></i>
          </span>
          <span>
            <strong id="avatar-state-label">随时可以开始</strong>
            <small id="avatar-state-hint">等待你的问题</small>
          </span>
        </div>

        <div class="avatar-stage" id="avatar-stage" data-state="idle">
          <video
            class="avatar-video"
            id="avatar-video-idle"
            data-avatar-video="idle"
            muted
            loop
            playsinline
            webkit-playsinline
            x5-playsinline="true"
            disablepictureinpicture
            preload="none"
            aria-hidden="true"
          ></video>
          <video
            class="avatar-video"
            id="avatar-video-thinking"
            data-avatar-video="thinking"
            muted
            loop
            playsinline
            webkit-playsinline
            x5-playsinline="true"
            disablepictureinpicture
            preload="none"
            aria-hidden="true"
          ></video>
          <video
            class="avatar-video"
            id="avatar-video-speaking"
            data-avatar-video="speaking"
            muted
            loop
            playsinline
            webkit-playsinline
            x5-playsinline="true"
            disablepictureinpicture
            preload="none"
            aria-hidden="true"
          ></video>
          <video
            class="avatar-video"
            id="avatar-video-presenting"
            data-avatar-video="presenting"
            muted
            loop
            playsinline
            webkit-playsinline
            x5-playsinline="true"
            disablepictureinpicture
            preload="none"
            aria-hidden="true"
          ></video>

          <img
            class="avatar-poster"
            id="avatar-poster"
            src="/avatar-media/idle-poster.jpg?v=background-v2-aligned-20260908"
            width="540"
            height="720"
            alt=""
            fetchpriority="high"
          >
        </div>

        <div class="media-note" id="media-note" hidden>
          <span aria-hidden="true">◇</span>
          <span id="media-note-copy" role="status">点击启用人物动态</span>
          <button id="media-retry" type="button" hidden>播放人物</button>
        </div>

        <div class="character-caption">
          <span class="caption-line" aria-hidden="true"></span>
          <span>
            <small>数字助手</small>
            <strong id="avatar-name">大未来</strong>
          </span>
        </div>
      </section>

      <section class="conversation-panel" aria-labelledby="conversation-title">
        <div class="conversation-heading">
          <div>
            <p class="eyebrow">SMART CAMPUS GUIDE</p>
            <h1 id="conversation-title">有什么想了解的？</h1>
          </div>
        </div>

        <section class="hosting-banner" id="hosting-banner" aria-live="polite" hidden>
          <span class="hosting-banner-icon" aria-hidden="true">播</span>
          <div>
            <small>后台主持控制已接管</small>
            <strong id="hosting-script-title">等待主持人选择文稿</strong>
            <p id="hosting-script-preview">主持模式下暂不接受现场提问。</p>
          </div>
        </section>

        <div class="conversation-log" id="conversation-log" aria-live="polite" aria-relevant="additions"></div>

        <div class="quick-question-list" id="quick-question-list" aria-label="快捷问题"></div>

        <form class="question-composer" id="question-form">
          <label for="question-input" class="visually-hidden">输入问题</label>
          <textarea
            id="question-input"
            rows="1"
            maxlength="500"
            placeholder="输入你想问的问题…"
            required
          ></textarea>
          <button
            class="voice-input-button"
            id="voice-input-button"
            type="button"
            aria-label="开始语音输入"
            aria-pressed="false"
            title="语音提问"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 14.5a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5a3.5 3.5 0 0 0 3.5 3.5Z"></path>
              <path d="M5.8 10.8a6.2 6.2 0 0 0 12.4 0M12 17v3M9.2 20h5.6"></path>
            </svg>
          </button>
          <button class="send-button" id="send-button" type="submit" aria-label="发送问题">
            <span aria-hidden="true">↗</span>
          </button>
        </form>
        <p class="composer-hint" id="composer-hint" aria-live="polite">输入文字或点击麦克风提问 · AI 回答仅供参考</p>

        <section class="preview-panel" id="preview-panel" hidden aria-label="姿态预览">
          <span>姿态预览</span>
          <div>
            <button type="button" data-preview-state="idle">默认</button>
            <button type="button" data-preview-state="thinking">思考</button>
            <button type="button" data-preview-state="speaking">对话</button>
            <button type="button" data-preview-state="presenting">主持</button>
          </div>
          <p class="media-debug" id="media-debug" aria-live="polite"></p>
        </section>
      </section>
    </main>

    <noscript>
      <p class="noscript-note">请启用 JavaScript 以使用数字人问答。</p>
    </noscript>

    <script type="module" src="/avatar.js"></script>
  </body>
</html>
